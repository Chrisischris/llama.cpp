name: land-inkling-mainline

# One-shot, started by schedule because API commits on this fork do not
# trigger push workflows. Force-pushes master to the inkling2_loop commit
# plus the Spore patches. That push removes this file, so the schedule
# does not repeat.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild master from upstream and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_RELEASE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/inkling-patches
          base=https://raw.githubusercontent.com/sporeintel/homebrew-tap/329440244d6bab593a0c5036806a78534c113045/inkling-patches
          for name in \
            0001-fix-always-pass-tools-in-jinja-context-to-prevent-Un.patch \
            0002-router-allow-extra-args-flag.patch \
            0003-model-inkling2_loop-re-share-the-loop-slots-after-th.patch \
            0004-ci-skip-s390x-release-runners-on-this-fork.patch
          do
            curl -fsSL "$base/$name" -o "/tmp/inkling-patches/$name"
          done
          git init -q /tmp/land
          cd /tmp/land
          git config user.email "me@chrishaen.com"
          git config user.name "Chris Haen"
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          # Pin the Inkling 2 Mini merge. Later upstream commits must not move this reset.
          git fetch --no-tags upstream 29b52d398b294509746ec0a3f28948a3107c0213
          git checkout --detach FETCH_HEAD
          git am /tmp/inkling-patches/*.patch
          echo "landed $(git rev-parse HEAD) count $(git rev-list --count HEAD)"
          test "$(git rev-list --count HEAD)" = "12604"
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$tree" = "250fe20d0629eb1c2dd38223d607877479f28a3f"

          current=$(git ls-remote https://github.com/Chrisischris/llama.cpp.git refs/heads/master | awk '{print $1}')
          echo "leasing $current"
          if git cat-file -e "$current^{tree}" 2>/dev/null; then
            if [ "$(git rev-parse "$current^{tree}")" = "250fe20d0629eb1c2dd38223d607877479f28a3f" ]; then
              echo "master already has the landed tree"
              exit 0
            fi
          fi

          pushed=0
          if [ -n "${DEPLOY_KEY}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            if GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
              git push --force-with-lease=refs/heads/master:"$current" git@github.com:Chrisischris/llama.cpp.git HEAD:master; then
              pushed=1
              echo "pushed with deploy key"
            else
              echo "deploy key push failed; falling back to GITHUB_TOKEN"
            fi
          fi
          if [ "$pushed" -eq 0 ]; then
            git push --force-with-lease=refs/heads/master:"$current" \
              "https://x-access-token:${GH_TOKEN}@github.com/Chrisischris/llama.cpp.git" HEAD:master
            echo "pushed with GITHUB_TOKEN; dispatching Release"
            gh workflow run release.yml --ref master -f create_release=true
          fi
